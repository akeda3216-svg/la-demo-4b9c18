<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Laule'a｜宝塚のプライベートネイルサロン</title>
<meta name="description" content="宝塚駅徒歩10分、宝塚歌劇場近くのネイルサロン Laule'a（ラウレア）。大人ニュアンス・シンプルネイル、フィルイン、持ちのいいネイル。初めての方も安心。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ec;--ink:#3a2f33;--sub:#7b6c72;--mauve:#b78a9b;--plum:#4a2c3f;--gold:#c8a46a;--line:#e3d8d0;--demo:38px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.85;letter-spacing:.04em;overflow-x:hidden}
a{color:inherit}button{font-family:inherit}
.demo{background:var(--ink);color:#fff;font-size:12px;line-height:1.6;text-align:center;padding:8px 12px;min-height:var(--demo)}

.hero{position:relative;height:calc(100svh - var(--demo));min-height:560px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.2fr);gap:clamp(18px,4vw,64px);align-items:center;padding:clamp(18px,3vw,40px) clamp(18px,5vw,84px);overflow:hidden;touch-action:pan-y;--mx:50%}
.hero::before{content:"";position:absolute;right:-12%;top:-20%;width:62vw;height:62vw;border-radius:50%;background:radial-gradient(circle,rgba(183,138,155,.22),rgba(183,138,155,0) 65%);pointer-events:none}
.brand{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;font-size:clamp(22px,2.4vw,32px);letter-spacing:.04em;line-height:1}
.brand small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-style:normal;font-weight:500;font-size:10.5px;letter-spacing:.28em;color:var(--sub);margin-top:6px}
.copy{position:relative;z-index:2}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--mauve);font-weight:700;margin:clamp(18px,3.4vh,40px) 0 10px}
h1{font-family:"Zen Old Mincho",serif;font-weight:500;font-size:clamp(26px,3.15vw,50px);line-height:1.5;letter-spacing:.06em}
h1 span{white-space:nowrap}
h1 span{display:block}
.anim h1 span{animation:track 1.6s var(--ease) both;opacity:0}
.anim h1 span:nth-child(2){animation-delay:.2s}
@keyframes track{from{letter-spacing:.5em;opacity:0;filter:blur(6px)}to{letter-spacing:.06em;opacity:1;filter:blur(0)}}
.noanim h1 span{opacity:1}
h1 em{font-style:normal;background:linear-gradient(transparent 70%,rgba(183,138,155,.45) 70%)}
.lead{margin:14px 0 18px;max-width:27em;color:var(--sub);font-size:clamp(13.5px,1.2vw,16px)}
.chips{display:flex;flex-wrap:wrap;gap:6px 8px;margin-bottom:20px}
.chip{font-size:12px;border:1px solid var(--mauve);color:var(--plum);padding:1px 12px;border-radius:999px;background:rgba(255,255,255,.55)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:12px 30px;background:var(--plum);color:#fff;text-decoration:none;font-weight:700;letter-spacing:.08em;border-radius:999px;box-shadow:0 12px 26px rgba(74,44,63,.28);transition:transform .25s,box-shadow .25s}
.cta::after{content:"";width:8px;height:8px;border-right:2px solid var(--gold);border-top:2px solid var(--gold);transform:rotate(45deg)}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 30px rgba(74,44,63,.36)}
.cta:focus-visible{outline:3px solid var(--mauve);outline-offset:3px}
.loc{margin-top:12px;font-size:12px;color:var(--sub);letter-spacing:.12em}

/* 爪のかたちのパネル：選ぶとひらく */
.nails{position:relative;z-index:2;display:flex;gap:clamp(6px,1vw,14px);height:min(66vh,560px);min-height:300px;align-items:stretch}
.nl{position:relative;flex:1;border:0;padding:0;cursor:pointer;border-radius:999px 999px 26px 26px;overflow:hidden;color:#fff;text-align:left;transition:flex .9s var(--ease),transform .5s var(--ease);box-shadow:0 18px 34px rgba(74,44,63,.2)}
.nl.on{flex:5.2}
.nl:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
.nl .bg{position:absolute;inset:0}
.nl::after{content:"";position:absolute;left:12%;top:5%;width:24%;height:42%;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(255,255,255,0));filter:blur(1px);transform:rotate(14deg);pointer-events:none;opacity:.85}
.nl .tx{position:absolute;left:0;right:0;bottom:0;padding:18px 16px 18px;background:linear-gradient(to top,rgba(30,12,24,.55),rgba(30,12,24,0));opacity:0;transform:translateY(14px);transition:opacity .5s .25s,transform .7s var(--ease) .25s}
.nl.on .tx{opacity:1;transform:none}
.nl .tx b{display:block;font-family:"Zen Old Mincho",serif;font-weight:700;font-size:clamp(17px,1.9vw,24px);letter-spacing:.1em}
.nl .tx span{display:block;font-size:clamp(11.5px,1.05vw,13.5px);line-height:1.6;opacity:.95;margin-top:2px}
.nl .no{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:19px;letter-spacing:.14em;transition:opacity .4s;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.nl.on .no{opacity:0}
/* 5つのデザイン（イメージ） */
.d1 .bg{background:linear-gradient(165deg,#f3d6d3,#e9b9b6 55%,#d99c9c)}
.d2 .bg{background:radial-gradient(120% 90% at 50% 100%,#2c1428,#4a2c3f 55%,#6c3a56)}
.d2 .bg::before{content:"";position:absolute;inset:-10% 0;background:linear-gradient(105deg,transparent calc(var(--mx) - 22%),rgba(255,226,250,.0) calc(var(--mx) - 15%),rgba(255,226,250,.85) var(--mx),rgba(255,226,250,0) calc(var(--mx) + 15%),transparent calc(var(--mx) + 22%));mix-blend-mode:screen;filter:blur(3px)}
.d3 .bg{background:conic-gradient(from 210deg at 50% 60%,#f6c8d8,#c9d6f6,#d8f1e6,#f7e3b5,#f6c8d8);animation:spin 18s linear infinite}
@keyframes spin{to{filter:hue-rotate(40deg)}}
.d4 .bg{background:linear-gradient(170deg,#f1e2d5,#e6cfbe)}
.d4 .bg::before{content:"";position:absolute;left:0;right:0;top:56%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.9}
.d5 .bg{background:radial-gradient(60% 50% at 30% 30%,#fff 0,transparent 60%),radial-gradient(70% 60% at 70% 75%,#cfa6b8,transparent 70%),#e9dde0}
.d4 .tx,.d1 .tx,.d5 .tx{background:linear-gradient(to top,rgba(70,40,55,.45),rgba(70,40,55,0))}
.note{position:absolute;right:clamp(18px,5vw,84px);bottom:10px;z-index:3;font-size:11px;color:var(--sub);background:rgba(246,241,236,.85);padding:1px 10px;border-radius:999px}

@media(max-width:820px){
  .hero{grid-template-columns:1fr;align-content:start;gap:10px;padding:14px 16px 8px;height:auto;min-height:calc(100svh - var(--demo))}
  .eyebrow{margin:12px 0 6px;font-size:11px}
  h1{font-size:clamp(25px,7.2vw,31px);line-height:1.45}
  .lead{margin:8px 0 10px;font-size:13px;line-height:1.7}
  .chips{display:none}
  .nails{order:2;height:clamp(250px,36svh,330px);min-height:0;gap:6px}
  .nl{border-radius:999px 999px 18px 18px}
  .nl .no{font-size:15px}
  .nl .tx{padding:12px 10px}
  .nl .tx b{font-size:15px}.nl .tx span{font-size:11px}
  .cta-wrap{order:3}
  .cta{width:100%;min-height:50px}
  .loc{text-align:center;margin-top:8px;font-size:11px}
  .note{display:none}
  .hero::before{width:90vw;height:90vw}
}
@media(prefers-reduced-motion:reduce){.d3 .bg{animation:none}.nl{transition-duration:.01s}.anim h1 span{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="demo">これはLaule'a様向けに作ったデモ（トップページのみ・非公開の見本）です。内容はInstagramの公開情報をもとにしています。</div>
<header class="hero" id="hero">
  <div class="copy">
    <div class="brand">Laule'a<small>PRIVATE NAIL SALON ｜ 宝塚</small></div>
    <p class="eyebrow">大人ニュアンス・シンプルネイル</p>
    <h1 id="h1" aria-label="手に自信がなくても、きれいは作れます。"><span>手に自信がなくても、</span><span><em>きれい</em>は作れます。</span></h1>
    <p class="lead">爪が薄い、持ちが悪い、人見知り、緊張する。そんな方こそ、初めてでも安心して通えるサロンです。フィルイン施術・持ちのいいネイルで、整えます。</p>
    <div class="chips"><span class="chip">初めての方も安心</span><span class="chip">フィルイン</span><span class="chip">持ちのいいネイル</span></div>
    <div class="cta-wrap"><a class="cta" href="https://lin.ee/bV9vKXf" target="_blank" rel="noopener">LINEで、予約・相談する</a>
    <p class="loc">宝塚駅 徒歩10分｜宝塚歌劇場近く</p></div>
  </div>
  <div class="nails" id="nails" role="group" aria-label="デザインの例：選ぶとひらきます">
    <button class="nl d1 on" aria-pressed="true"><span class="bg"></span><span class="no">one color</span><span class="tx"><b>ワンカラー</b><span>色をひとつ。爪をきれいに見せる、いちばんシンプルな形。</span></span></button>
    <button class="nl d2" aria-pressed="false"><span class="bg"></span><span class="no">magnet</span><span class="tx"><b>マグネット</b><span>角度で光が動く、ちゅるんとした奥行き。指を動かすと、光もついてきます。</span></span></button>
    <button class="nl d3" aria-pressed="false"><span class="bg"></span><span class="no">flash mix</span><span class="tx"><b>フラッシュミックス</b><span>光の当たり方で、色が変わる。秋の色っぽさも。</span></span></button>
    <button class="nl d4" aria-pressed="false"><span class="bg"></span><span class="no">simple</span><span class="tx"><b>シンプルデザイン</b><span>お仕事中も浮かない、控えめで、きちんと見える。</span></span></button>
    <button class="nl d5" aria-pressed="false"><span class="bg"></span><span class="no">nuance</span><span class="tx"><b>大人ニュアンス</b><span>やわらかな色のにじみで、手元をやさしく。</span></span></button>
  </div>
  <p class="note">※ 色・デザインはイメージ図です。実際の作品ではありません</p>
</header>

<script>
(function(){
  var root=document.documentElement,hero=document.getElementById("hero");
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var visible=document.visibilityState==="visible";
  root.classList.add(visible&&!reduce?"anim":"noanim");

  /* 爪パネル：選ぶとひらく。操作がなければ、ゆっくり順にひらく */
  var ps=[].slice.call(document.querySelectorAll(".nl")),cur=0,touched=false;
  function open(i){cur=i;ps.forEach(function(p,k){p.classList.toggle("on",k===i);p.setAttribute("aria-pressed",k===i?"true":"false")})}
  ps.forEach(function(p,i){p.addEventListener("click",function(){touched=true;open(i)});p.addEventListener("mouseenter",function(){if(window.matchMedia("(hover:hover)").matches){touched=true;open(i)}})});
  if(!reduce&&visible)setInterval(function(){if(!touched)open((cur+1)%ps.length)},4200);

  /* マグネット：指・マウスの動きに合わせて、光の帯が動く（操作がなければ、ゆっくり往復） */
  var used=false,t0=performance.now(),mx=50;
  function set(v){mx=Math.max(8,Math.min(92,v));hero.style.setProperty("--mx",mx+"%")}
  function pt(e){var r=hero.getBoundingClientRect();set((e.clientX-r.left)/r.width*100);used=true}
  hero.addEventListener("pointermove",pt);hero.addEventListener("pointerdown",pt);
  if(!reduce&&visible){var loop=function(now){if(!used)set(50+36*Math.sin((now-t0)/1000*.9));requestAnimationFrame(loop)};requestAnimationFrame(loop)}
})();
</script>
</body>
</html>
