<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Laule'a｜宝塚のプライベートネイルサロン</title>
<meta name="description" content="宝塚駅徒歩10分、宝塚歌劇場近くのネイルサロン Laule'a（ラウレア）。大人ニュアンス・シンプルネイル、フィルイン、持ちのいいネイル。初めての方も安心。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--rose1:#a8456a;--rose2:#d4728f;--ivory:#fff6ef;--plum:#3d1f33;--gold:#f0cf9a;--demo:38px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--rose1);color:var(--ivory);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-weight:500;overflow-x:hidden}
a{color:inherit}button{font-family:inherit}
.demo{background:var(--plum);color:#fff;font-size:12px;line-height:1.6;text-align:center;padding:8px 12px;min-height:var(--demo)}

.hero{position:relative;height:calc(100svh - var(--demo));min-height:560px;overflow:hidden;--mx:50%;touch-action:pan-y;
  background:radial-gradient(90% 70% at 70% 30%,#d97a95 0,transparent 60%),linear-gradient(160deg,var(--rose2),var(--rose1) 60%,#8f3158)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(60,15,40,.35) 100%)}

.top{position:absolute;z-index:6;left:clamp(16px,2.4vw,34px);right:clamp(16px,2.4vw,34px);top:clamp(14px,2.4vw,28px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.logo{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;font-size:clamp(26px,3vw,40px);line-height:1}
.logo small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-style:normal;font-size:10.5px;letter-spacing:.28em;opacity:.9;margin-top:6px}
.top .sub{font-size:12px;letter-spacing:.2em;text-align:right;line-height:1.7;opacity:.95}

/* 巨大な一文字 */
.giant{position:absolute;z-index:2;left:50%;top:39%;transform:translate(-50%,-50%);font-family:"Shippori Mincho",serif;font-weight:800;font-size:min(58vh,40vw);line-height:1;letter-spacing:0;user-select:none;-webkit-user-select:none;pointer-events:none;color:var(--ivory);text-shadow:0 16px 26px rgba(60,10,35,.28)}
.giant::after{content:attr(data-c);position:absolute;left:0;top:0;width:100%;text-align:center;color:transparent;-webkit-text-fill-color:transparent;background:linear-gradient(105deg,transparent calc(var(--mx) - 20%),rgba(240,207,154,.95) var(--mx),transparent calc(var(--mx) + 20%));-webkit-background-clip:text;background-clip:text;text-shadow:none}
.anim .giant{animation:gin 1.3s var(--ease) both}
@keyframes gin{from{opacity:0;transform:translate(-50%,-44%) scale(.84) rotate(-4deg)}}

/* 左右に分けた一行 */
.line{position:absolute;z-index:4;top:50%;font-family:"Shippori Mincho",serif;font-weight:800;line-height:1.35;text-shadow:0 2px 16px rgba(60,10,35,.3)}
.line.l{left:clamp(14px,2.4vw,34px);font-size:clamp(20px,2.7vw,40px);transform:translateY(-120%)}
.line.r{right:clamp(14px,2.4vw,34px);font-size:clamp(20px,2.7vw,40px);text-align:right;transform:translateY(-10%)}
.line.r em{font-style:normal;color:var(--gold)}
.anim .line{animation:lin 1.2s var(--ease) .7s both}
@keyframes lin{from{opacity:0;letter-spacing:.4em}}

/* 画面の下を走る、10本の爪 */
.run{position:absolute;z-index:5;left:0;right:0;bottom:clamp(72px,11vh,112px);display:flex;justify-content:center;align-items:flex-end;gap:clamp(4px,1vw,16px);padding:0 clamp(8px,2vw,40px)}
.n{position:relative;flex:none;width:clamp(30px,6.3vw,92px);height:clamp(60px,15vh,150px);border:0;cursor:pointer;border-radius:999px 999px 14px 14px;overflow:hidden;box-shadow:0 14px 22px rgba(60,10,35,.35);transform-origin:50% 100%;animation:trot 1.1s ease-in-out infinite;animation-delay:calc(var(--i)*-.11s)}
.n:nth-child(even){height:clamp(52px,13vh,130px)}
.n:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@keyframes trot{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-12px) rotate(2.5deg)}}
.anim .n{animation:trot 1.1s ease-in-out infinite,enter 1s var(--ease) both;animation-delay:calc(var(--i)*-.11s),calc(.9s + var(--i)*.07s)}
@keyframes enter{from{opacity:0;margin-left:-60vw}}
.n::after{content:"";position:absolute;left:14%;top:5%;width:30%;height:44%;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.75),rgba(255,255,255,0));transform:rotate(14deg)}
.n.pop{animation:none;transform:translateY(-26px) scale(1.12);transition:transform .3s var(--ease)}
.c1{background:linear-gradient(165deg,#f6d9d6,#e6a9ab)}
.c2{background:radial-gradient(120% 90% at 50% 100%,#2c1428,#5a3250 60%,#7e4568)}
.c2::before{content:"";position:absolute;inset:-10% 0;background:linear-gradient(105deg,transparent calc(var(--mx) - 30%),rgba(255,226,250,.9) var(--mx),transparent calc(var(--mx) + 30%));mix-blend-mode:screen;filter:blur(2px)}
.c3{background:conic-gradient(from 210deg at 50% 60%,#f6c8d8,#c9d6f6,#d8f1e6,#f7e3b5,#f6c8d8)}
.c4{background:linear-gradient(170deg,#f1e2d5,#e0c6b2)}
.c4::before{content:"";position:absolute;left:0;right:0;top:58%;height:2px;background:var(--gold)}
.c5{background:radial-gradient(60% 50% at 30% 30%,#fff 0,transparent 60%),radial-gradient(70% 60% at 70% 75%,#cfa6b8,transparent 70%),#efe3e6}
.cap{position:absolute;z-index:6;left:50%;bottom:clamp(54px,8.2vh,84px);transform:translateX(-50%);font-family:"Cormorant Garamond",serif;font-style:italic;font-size:15px;letter-spacing:.2em;transition:opacity .4s;white-space:nowrap}

/* 下部：ボタン */
.foot{position:absolute;z-index:7;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:clamp(10px,1.8vw,22px) clamp(16px,2.4vw,34px)}
.cta{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:12px 30px;background:var(--ivory);color:var(--plum);text-decoration:none;font-weight:700;letter-spacing:.08em;border-radius:999px;box-shadow:0 10px 24px rgba(60,10,35,.35);transition:transform .25s,box-shadow .25s}
.cta::after{content:"→"}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(60,10,35,.45)}
.cta:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.info{font-size:12px;letter-spacing:.12em;text-align:right;line-height:1.7;opacity:.95}
.note{position:absolute;z-index:6;left:clamp(16px,2.4vw,34px);bottom:clamp(64px,10vh,96px);font-size:10.5px;opacity:.85}

@media(max-width:820px){
  .top .sub{display:none}
  .giant{font-size:min(44svh,92vw);top:43%}
  .line.l{left:16px;right:16px;top:78px;transform:none;font-size:clamp(21px,6.3vw,27px);text-align:left}
  .line.r{left:16px;right:16px;top:calc(78px + clamp(21px,6.3vw,27px) * 1.4);transform:none;font-size:clamp(21px,6.3vw,27px);text-align:left}
  .run{bottom:112px;gap:3px;padding:0 6px}
  .n{width:clamp(27px,8.4vw,36px);height:clamp(58px,11.5svh,88px)}
  .n:nth-child(even){height:clamp(48px,9.5svh,74px)}
  .foot{padding:10px 14px;flex-direction:column;align-items:stretch;gap:6px}
  .cta{justify-content:center;min-height:50px}
  .info{text-align:center;font-size:11px}
  .info br{display:none}
  .cap{display:none}
  .note{display:none}
}

@media(min-width:821px){
  .hero{display:flex;flex-direction:column;padding-top:clamp(84px,11vh,110px)}
  .stage{position:relative;flex:1 1 0;min-height:0;container-type:size}
  .giant{top:50%;font-size:min(90cqh,38cqw)}
  .line{top:50%}
  .run{position:relative;left:auto;right:auto;bottom:auto;flex:none;margin-top:clamp(6px,1.4vh,16px)}
  .n{height:clamp(58px,13vh,128px)}
  .n:nth-child(even){height:clamp(50px,11vh,108px)}
  .cap{position:static;transform:none;text-align:center;margin:8px 0 0;flex:none}
  .foot{position:relative;flex:none}
  .note{bottom:clamp(64px,10vh,96px)}
}
@media(max-width:820px){.stage{display:contents}}
@media(prefers-reduced-motion:reduce){.n{animation:none!important;opacity:1}.anim .giant,.anim .line{animation:none}}
</style>
</head>
<body>
<div class="demo">これはLaule'a様向けに作ったデモ（トップページのみ・非公開の見本）です。内容はInstagramの公開情報をもとにしています。</div>
<header class="hero" id="hero">
  <div class="top"><div class="logo">Laule'a<small>PRIVATE NAIL SALON ｜ 宝塚</small></div><div class="sub">大人ニュアンス・シンプルネイル<br>フィルイン施術</div></div>
  <div class="stage">
  <div class="giant" aria-hidden="true" data-c="手">手</div>
  <h1 class="line l" id="h1a">手に自信がなくても、</h1>
  <p class="line r"><em>きれい</em>は作れます。</p>
  </div>
  <div class="run" id="run" role="group" aria-label="10本の爪のデザイン例。タップすると跳ねます">
    <button class="n c1" style="--i:0" data-t="one color"></button><button class="n c2" style="--i:1" data-t="magnet"></button><button class="n c3" style="--i:2" data-t="flash mix"></button><button class="n c4" style="--i:3" data-t="simple"></button><button class="n c5" style="--i:4" data-t="nuance"></button>
    <button class="n c1" style="--i:5" data-t="one color"></button><button class="n c2" style="--i:6" data-t="magnet"></button><button class="n c3" style="--i:7" data-t="flash mix"></button><button class="n c4" style="--i:8" data-t="simple"></button><button class="n c5" style="--i:9" data-t="nuance"></button>
  </div>
  <p class="cap" id="cap" aria-live="polite">10本、ぜんぶ、あなたの爪に。</p>
  <p class="note">※ 色・デザインはイメージ図です</p>
  <div class="foot"><a class="cta" href="https://lin.ee/bV9vKXf" target="_blank" rel="noopener">LINEで、予約・相談する</a><p class="info">宝塚駅 徒歩10分｜宝塚歌劇場近く<br>初めての方も安心です</p></div>
</header>
<script>
(function(){
  var root=document.documentElement,hero=document.getElementById("hero"),cap=document.getElementById("cap");
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var visible=document.visibilityState==="visible";
  if(visible&&!reduce)root.classList.add("anim");

  /* 光の帯：指・マウスの動きについてくる（操作がなければ、ゆっくり往復） */
  var used=false,t0=performance.now();
  function set(v){hero.style.setProperty("--mx",Math.max(6,Math.min(94,v))+"%")}
  function pt(e){var r=hero.getBoundingClientRect();set((e.clientX-r.left)/r.width*100);used=true}
  hero.addEventListener("pointermove",pt);hero.addEventListener("pointerdown",pt);
  if(!reduce&&visible){var loop=function(now){if(!used)set(50+40*Math.sin((now-t0)/1000*.8));requestAnimationFrame(loop)};requestAnimationFrame(loop)}

  /* 爪をタップすると、ぴょんと跳ねて、デザイン名が出る */
  [].slice.call(document.querySelectorAll(".n")).forEach(function(n){
    n.addEventListener("click",function(){
      cap.textContent=n.getAttribute("data-t");
      n.classList.add("pop");setTimeout(function(){n.classList.remove("pop")},420);
    });
  });
})();
</script>
</body>
</html>
